  <!-- Topo -->

  <!-- Conteúdo Principal -->
  <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-1">
    
    <!-- Caixa de Busca Rápida de Outra OS -->
    <div class="mb-8 p-4 rounded-2xl bg-slate-900/60 border border-slate-800">
      <form id="form-busca-rastreio" class="flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <input 
            type="text" 
            id="input-busca-rastreio" 
            placeholder="Digite o número da OS ou código de rastreio (ex: 538)" 
            class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
          >
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>
        </div>
        <button type="submit" class="px-6 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl text-sm transition">
          Buscar OS
        </button>
      </form>
    </div>

    <!-- Contêiner do Resultado da OS -->
    <div id="rastreio-container" class="bg-slate-900/90 rounded-2xl border border-slate-800 p-6 sm:p-8 shadow-2xl min-h-[300px]">
      <div id="rastreio-loading" class="py-20 text-center space-y-4">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-cyan-500 border-t-transparent"></div>
        <p class="text-sm text-slate-400 font-medium">Buscando informações do seu equipamento...</p>
      </div>

      <div id="rastreio-content" class="hidden"></div>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>© 2026 CG Info - Assistência Técnica Especializada em Informática. Todos os direitos reservados.</p>
  </footer>

  <script src="/js/os-tracker.js"></script>
  <script>
    // Customização da página dedicada de rastreio
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('rastreio-content');
      const loading = document.getElementById('rastreio-loading');
      const formRastreio = document.getElementById('form-busca-rastreio');
      const inputRastreio = document.getElementById('input-busca-rastreio');

      // Sobrescreve as funções de renderização para injetar no container em vez do modal
      window.abrirModalOs = () => {};
      window.fecharModalOs = () => {};
      
      const originalRenderDetails = window.renderOsDetails;
      window.renderOsDetails = (os) => {
        loading.classList.add('hidden');
        container.classList.remove('hidden');
        window.modalContent = container;
        originalRenderDetails(os);
      };

      const originalRenderError = window.renderErrorState;
      window.renderErrorState = (query) => {
        loading.classList.add('hidden');
        container.classList.remove('hidden');
        window.modalContent = container;
        originalRenderError(query);
      };

      if (formRastreio && inputRastreio) {
        formRastreio.addEventListener('submit', (e) => {
          e.preventDefault();
          const val = inputRastreio.value.trim();
          if (val) {
            loading.classList.remove('hidden');
            container.classList.add('hidden');
            consultarOs(val);
          }
        });
      }

      // Consulta automática por URL
      const pathParts = window.location.pathname.split('/');
      const tokenFromPath = pathParts[pathParts.length - 1];
      const urlParams = new URLSearchParams(window.location.search);
      const osQuery = urlParams.get('os') || urlParams.get('token') || (tokenFromPath && tokenFromPath !== 'rastreio.html' ? tokenFromPath : null);

      if (osQuery) {
        if (inputRastreio) inputRastreio.value = osQuery;
        consultarOs(osQuery);
      } else {
        consultarOs('538'); // Carrega a OS mais recente por padrão
      }
    });
  </script>
</body>
</html>
